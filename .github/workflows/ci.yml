name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all]"
      - name: Lint
        run: |
          ruff check src tests ui
          ruff format --check src tests ui
      - name: Test (offline provider, no secrets needed)
        run: pytest -q
      - name: Evaluation on the synthetic report
        run: esg-lens eval data/gold/sample.jsonl --out eval_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: eval_report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t esg-lens:ci .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep (compile + lint)
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep lint --file infra/azure/main.bicep
