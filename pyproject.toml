[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-lens"
version = "0.1.0"
description = "Multi-agent extraction of ESG KPIs from public sustainability reports, with citations and evaluation. Runs on Azure OpenAI, Gemini or Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pypdf>=4.0",
  "fonttools>=4.50",  # lets pypdf decode embedded CFF fonts used in corporate reports
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "reportlab>=4.0",
]

[project.optional-dependencies]
openai = ["openai>=1.108,<4"]
azure = ["openai>=1.108,<4", "azure-identity>=1.16"]
gemini = ["google-genai>=1.30,<4"]
anthropic = ["anthropic>=2.0,<3"]
ui = ["streamlit>=1.50", "requests>=2.31"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "ruff>=0.5"]
all = ["esg-lens[openai,azure,gemini,anthropic,ui,mcp,dev]"]

[project.scripts]
esg-lens = "esg_lens.cli:main"
esg-lens-mcp = "esg_lens.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) / Depends(...) defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"src/esg_lens/agents/prompts.py" = ["E501"]
"src/esg_lens/sample.py" = ["E501"]
